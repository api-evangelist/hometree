aid: hometree
name: Hometree
description: Hometree is a UK home services and residential energy company offering
  homeowners and landlords subscription-based boiler and home emergency cover with
  unlimited repairs and annual maintenance from around £12.95 per month. Its nationwide
  network of Gas Safe registered engineers handles breakdowns across heating, plumbing,
  electrics, drainage and gas fires, and the company also arranges boiler installations
  and green home upgrades such as heat pumps and solar panels. Operating as an insurance
  distributor and installer across mainland England, Scotland and Wales, Hometree is
  backed by Anthemis, DN Capital, Barclays, BlackRock, 2150 and Puma Growth Partners.
